name: Publish

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  time:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.date.outputs.time }}
      y: ${{ steps.date.outputs.y }}
      md: ${{ steps.date.outputs.md }}
      hm: ${{ steps.date.outputs.hm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Version
        id: date
        run: |
          echo "time=$(TZ='Asia/Shanghai' date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT
          echo "y=$(TZ='Asia/Shanghai' date +'%Y')" >> $GITHUB_OUTPUT
          echo "md=$(TZ='Asia/Shanghai' date +'%m%d')" >> $GITHUB_OUTPUT
          echo "hm=$(TZ='Asia/Shanghai' date +'%H%M')" >> $GITHUB_OUTPUT
      - name: Display Version
        run: |
          echo "Version: ${{ steps.date.outputs.time }}"

  linux:
    runs-on: ubuntu-22.04
    needs: time
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write Version
        run: echo "${{ needs.time.outputs.v }}" > ./YMCL.Main/YMCL/Public/Texts/DateTime.txt
      - name: Install Dependencies
        run: |
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0
          sudo apt-get update -qq
          sudo apt-get install -y fuse
      - name: Build AppImage (x64)
        run: |
          cd ./YMCL.Main/YMCL.Desktop
          sudo pupnet --runtime linux-x64 --kind appimage -o YMCL.Desktop.linux.x64.AppImage -y --app-version ${{ needs.time.outputs.y }}.${{ needs.time.outputs.md }}.${{ needs.time.outputs.hm }}
      - name: Build AppImage (ARM)
        run: |
          cd ./YMCL.Main/YMCL.Desktop
          sudo pupnet --runtime linux-arm --kind appimage -o YMCL.Desktop.linux.arm.AppImage -y --app-version ${{ needs.time.outputs.y }}.${{ needs.time.outputs.md }}.${{ needs.time.outputs.hm }}
      - name: Build AppImage (ARM64)
        run: |
          cd ./YMCL.Main/YMCL.Desktop
          sudo pupnet --runtime linux-arm64 --kind appimage -o YMCL.Desktop.linux.arm64.AppImage -y --app-version ${{ needs.time.outputs.y }}.${{ needs.time.outputs.md }}.${{ needs.time.outputs.hm }}
      - name: Build macOS App (x64)
        run: |
          cd ./YMCL.Main/YMCL.Desktop
          dotnet restore -r osx-x64
          dotnet msbuild -t:BundleApp -p:RuntimeIdentifier=osx-x64 -property:Configuration=Release -p:SelfContained=true
          cp ./Icon-Border.icns "./bin/Release/net8.0/osx-x64/publish/YMCL.app/Contents/Resources/Icon-Border.icns"
          cd ./bin/Release/net8.0/osx-x64/publish/
          zip -9 -r ../../YMCL.Desktop.osx.mac.x64.app.zip "./YMCL.app"
      - name: Build Windows Executables
        run: |
          cd ./YMCL.Main/YMCL.Desktop
          for arch in win-x86 win-x64 win-arm64; do
            dotnet publish -c Release -r $arch --self-contained -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false
            mv ./bin/Release/net8.0/$arch/publish/YMCL.Desktop.exe ./bin/Release/net8.0/$arch/publish/YMCL.Desktop.win7.${arch#win-}.exe
            cd ./bin/Release/net8.0/$arch
            zip -9 -r ../YMCL.Desktop.win7.${arch#win-}.zip "./publish"
            cd ../../../..
          done
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            YMCL.Main/YMCL.Desktop/Deploy/OUT/*
            YMCL.Main/YMCL.Desktop/bin/Release/net8.0/*.zip
          retention-days: 1

  win:
    runs-on: windows-latest
    needs: time
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Inno Setup
        uses: ConorMacBride/install-package@v1
        with:
          choco: innosetup
      - name: Apply Chinese Localization
        run: Copy-Item "./YMCL.Main/YMCL/Public/Texts/Default.isl" "C:\Program Files (x86)\Inno Setup 6\Default.isl" -Force
      - name: Install PupNet
        run: dotnet tool install -g KuiperZone.PupNet --version 1.8.0
      - name: Write Version
        run: echo "${{ needs.time.outputs.v }}" > ./YMCL.Main/YMCL/Public/Texts/DateTime.txt
        shell: bash
      - name: Build Installers
        run: |
          cd ./YMCL.Main/YMCL.Desktop
          pupnet -r win-x64 -k setup -y -o YMCL.Desktop.win.x64.installer.exe --app-version ${{ needs.time.outputs.y }}.${{ needs.time.outputs.md }}.${{ needs.time.outputs.hm }}
          pupnet -r win-x86 -k setup -y -o YMCL.Desktop.win.x86.installer.exe --app-version ${{ needs.time.outputs.y }}.${{ needs.time.outputs.md }}.${{ needs.time.outputs.hm }}
          pupnet -r win-arm64 -k setup -y -o YMCL.Desktop.win.arm64.installer.exe --app-version ${{ needs.time.outputs.y }}.${{ needs.time.outputs.md }}.${{ needs.time.outputs.hm }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: ./YMCL.Main/YMCL.Desktop/Deploy/OUT/*
          retention-days: 1

  mac:
    needs: [linux, win, time]
    runs-on: macos-latest
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: ./YMCL.Release/
      - name: Extract macOS App
        run: unzip -n ./YMCL.Release/bin/Release/net8.0/YMCL.Desktop.osx.mac.x64.app.zip -d ./app.x64
      - name: Create DMG (x64)
        uses: L-Super/create-dmg-actions@v1.0.3
        with:
          dmg_name: "YMCL.Desktop.osx.mac.x64"
          src_dir: "./app.x64/YMCL.app"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osx-artifacts
          path: ./YMCL.Desktop.osx.mac.x64.dmg
          retention-days: 1

  publish:
    needs: [linux, win, mac, time]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Date
        id: gdate
        run: |
          echo "date=$(date +'%Y-%m-%d.%H-%M-%S')" >> $GITHUB_OUTPUT
          echo "title=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./YMCL.Release/
      - name: List Release Files
        run: find ./YMCL.Release/ -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.zip"
      - name: Publish Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.TOKEN }}"
          title: "v${{ needs.time.outputs.v }}"
          automatic_release_tag: "AutoPublish-${{ steps.gdate.outputs.date }}"
          prerelease: false
          files: |
            YMCL.Release/**/*.exe
            YMCL.Release/**/*.dmg
            YMCL.Release/**/*.AppImage
            YMCL.Release/**/*.zip
